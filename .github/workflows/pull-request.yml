name: Pull Request

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    # Plan the environment that matches the PR's target branch: main -> prd,
    # dev -> dev. So a PR to dev is reviewed against dev state, not prd.
    name: Plan ${{ github.base_ref == 'main' && 'prd' || 'dev' }} Changes
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: ${{ github.base_ref == 'main' && 'prd' || 'dev' }}
      action: plan
      terraform_version: '1.14.6'
    secrets:
      # PR plans assume the READ-ONLY pull-request role, not the deploy role.
      # The deploy role carries wildcard (*) perms on dev; a pull_request must
      # not be able to obtain those. This role is scoped to pull_request OIDC
      # subjects and granted read-only perms sufficient for `terraform plan`.
      AWS_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}
