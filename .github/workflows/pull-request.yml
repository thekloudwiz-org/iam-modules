name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/**'

jobs:
  plan-production:
    name: Plan Production Changes
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: prd
      action: plan
      terraform_version: '1.5.0'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
