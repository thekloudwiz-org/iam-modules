name: Pull Request

# Plans run on dev PRs only. main is deploy-only (production-deploy.yml applies
# on push to main) — code reaching main was already planned + reviewed on dev.
on:
  pull_request:
    branches:
      - dev
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan dev Changes
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      action: plan
      terraform_version: '1.14.6'
    secrets:
      # PR plans assume the READ-ONLY pull-request role, not the deploy role.
      # The deploy role carries wildcard (*) perms on dev; a pull_request must
      # not be able to obtain those. This role is scoped to pull_request OIDC
      # subjects and granted read-only perms sufficient for `terraform plan`.
      AWS_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}

  # Stable-named gate for branch protection to require. The plan job's own
  # check name is dynamic, which can't be pinned as a required context; this
  # job's name is constant.
  plan-gate:
    needs: [plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the plan to have succeeded
        run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "::error::Terraform plan did not pass (result: ${{ needs.plan.result }})"
            exit 1
          fi
          echo "Terraform plan passed."
