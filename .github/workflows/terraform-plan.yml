name: Terraform Plan

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "us-east-1"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: changes
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files: $CHANGED_FILES"
          
          # Initialize environments array
          ENVIRONMENTS=()
          
          # Check if global files changed (affects all environments)
          if echo "$CHANGED_FILES" | grep -E '\.(tf|tfvars)$' | grep -v 'environments/' | grep -q .; then
            ENVIRONMENTS=("dev" "stg" "qa" "prd")
          else
            # Check specific environment files
            for env in dev stg qa prd; do
              if echo "$CHANGED_FILES" | grep -q "environments/${env}.tfvars"; then
                ENVIRONMENTS+=("$env")
              fi
            done
          fi
          
          # Convert to a COMPACT (single-line) JSON array. $GITHUB_OUTPUT only
          # accepts multi-line values via the heredoc delimiter syntax, so a
          # pretty-printed array (jq -s) breaks "key=value". jq -cs keeps it on
          # one line.
          ENV_JSON=$(printf '%s\n' "${ENVIRONMENTS[@]}" | jq -R . | jq -cs .)
          echo "environments=$ENV_JSON" >> $GITHUB_OUTPUT
          echo "Detected environments: $ENV_JSON"

  terraform-plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.environments != '[]'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        # Auto-format in place instead of `-check` (which only errors on drift
        # and blocks the plan). This normalizes formatting before planning.
        run: terraform fmt -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/${{ matrix.environment }}.hcl \
            -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -out=tfplan-${{ matrix.environment }} \
            -no-color
        continue-on-error: true

      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan for \`${{ matrix.environment }}\` 📖
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: tfplan-${{ matrix.environment }}
          retention-days: 5
