name: Terraform Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy (dev, stg, qa, prd)'
        required: true
        type: string
      action:
        description: 'Action to perform (plan, apply)'
        required: true
        type: string
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.14.6'
    secrets:
      AWS_ROLE_ARN:
        required: true
      GH_PAT:
        required: true

env:
  AWS_REGION: eu-central-1

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-${{ inputs.action }}-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Extract GitHub Org
        id: github-org
        run: |
          GITHUB_ORG=$(grep '^github_org' global.tfvars | sed 's/.*= *"\(.*\)"/\1/')
          echo "org=$GITHUB_ORG" >> $GITHUB_OUTPUT
          echo "Resolved GitHub org: $GITHUB_ORG"

      - name: Validate GitHub Token
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is empty or not set."
            exit 1
          fi
          echo "GH_PAT is set (length: ${#GH_PAT} chars)"
          HTTP_CODE=$(curl -s -o /tmp/gh-response.json -w "%{http_code}" \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/orgs/${{ steps.github-org.outputs.org }})
          echo "GitHub API response code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PAT cannot access org ${{ steps.github-org.outputs.org }} (HTTP $HTTP_CODE). Check token scopes (needs admin:org)."
            cat /tmp/gh-response.json
            exit 1
          fi
          echo "✅ Token can access ${{ steps.github-org.outputs.org }}"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Debug Terraform Version
        run: |
          terraform version
          echo "--- Checking var files ---"
          cat global.tfvars | grep github_org || echo "github_org not found in global.tfvars"
          ls -la global.tfvars environments/${{ inputs.environment }}.tfvars

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Format (Fix)
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "Formatting issues found. Auto-formatting..."
          terraform fmt -recursive
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-format terraform files [skip ci]"
          git push || echo "No changes to push"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/${{ inputs.environment }}.hcl \
            -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_OWNER: ${{ steps.github-org.outputs.org }}
        run: |
          terraform plan \
            -var-file=environments/${{ inputs.environment }}.tfvars \
            -var-file=global.tfvars \
            -var-file=x-repos.tfvars \
            -var="github_token=${{ secrets.GH_PAT }}" \
            -out=tfplan-${{ inputs.environment }} \
            -no-color 2>&1 | tee /tmp/plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Show Plan Output on Failure
        if: steps.plan.outcome == 'failure'
        run: cat /tmp/plan-output.txt || echo "No plan output captured"

      - name: Update Pull Request
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && inputs.action == 'plan'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const output = `#### Terraform Plan for \`${{ inputs.environment }}\` 📖
            
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Environment: ${{ inputs.environment }}*
            *Action: ${{ github.event_name }}*
            *Actor: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: inputs.action == 'apply'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_OWNER: ${{ steps.github-org.outputs.org }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan-${{ inputs.environment }}

      - name: Create Issue on Failure
        if: failure() && inputs.action == 'apply'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform Apply Failed - ${{ inputs.environment }}`,
              body: `## Terraform Apply Failed
              
              **Environment:** ${{ inputs.environment }}
              **Workflow:** ${{ github.workflow }}
              **Run ID:** ${{ github.run_id }}
              
              Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              
              **Commit:** ${{ github.sha }}
              **Actor:** @${{ github.actor }}`,
              labels: ['terraform', 'infrastructure', 'bug', '${{ inputs.environment }}']
            })
