name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-*.yml'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - qa
          - prd
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "us-east-1"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed environments
        id: changes
        run: |
          # Get list of changed files in the last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED_FILES"
          
          # Initialize environments array
          ENVIRONMENTS=()
          
          # Check if global files changed (affects all environments)
          if echo "$CHANGED_FILES" | grep -E '\.(tf|tfvars)$' | grep -v 'environments/' | grep -q .; then
            ENVIRONMENTS=("dev" "stg" "qa" "prd")
          else
            # Check specific environment files
            for env in dev stg qa prd; do
              if echo "$CHANGED_FILES" | grep -q "environments/${env}.tfvars"; then
                ENVIRONMENTS+=("$env")
              fi
            done
          fi
          
          # Convert to JSON array
          ENV_JSON=$(printf '%s\n' "${ENVIRONMENTS[@]}" | jq -R . | jq -s .)
          echo "environments=$ENV_JSON" >> $GITHUB_OUTPUT
          echo "Detected environments: $ENV_JSON"

  terraform-apply:
    name: ${{ github.event.inputs.action || 'Apply' }} (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() && 
      (github.event_name == 'workflow_dispatch' || 
       (github.event_name == 'push' && needs.detect-changes.outputs.environments != '[]'))
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', github.event.inputs.environment)) || fromJson(needs.detect-changes.outputs.environments) }}
      max-parallel: 1  # Deploy one environment at a time
    
    environment:
      name: ${{ matrix.environment }}
      url: https://console.aws.amazon.com/iam/
    
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-${{ github.event.inputs.action || 'apply' }}-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/${{ matrix.environment }}.hcl \
            -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -out=tfplan-${{ matrix.environment }} \
            ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }}

      - name: Terraform Apply
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform apply \
            -auto-approve \
            tfplan-${{ matrix.environment }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform ${{ github.event.inputs.action || 'Apply' }} Failed - ${{ matrix.environment }}`,
              body: `## Terraform ${{ github.event.inputs.action || 'Apply' }} Failed
              
              **Environment:** ${{ matrix.environment }}
              **Action:** ${{ github.event.inputs.action || 'apply' }}
              **Workflow:** ${{ github.workflow }}
              **Run ID:** ${{ github.run_id }}
              
              Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              
              **Commit:** ${{ github.sha }}
              **Actor:** @${{ github.actor }}`,
              labels: ['terraform', 'infrastructure', 'bug', '${{ matrix.environment }}']
            })
