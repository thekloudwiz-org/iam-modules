name: Terraform Drift Detection

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check for drift'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - stg
          - qa
          - prd

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "us-east-1"

jobs:
  drift-detection:
    name: Drift Detection (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ (github.event.inputs.environment == 'all' || github.event.inputs.environment == '') && fromJson('["dev", "stg", "qa", "prd"]') || fromJson(format('["{0}"]', github.event.inputs.environment)) }}
      fail-fast: false
    
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-drift-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/${{ matrix.environment }}.hcl \
            -input=false

      - name: Terraform Plan (Drift Check)
        id: drift
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -detailed-exitcode \
            -no-color
        continue-on-error: true

      - name: Check for Drift
        id: check-drift
        run: |
          if [ ${{ steps.drift.outputs.exitcode }} -eq 2 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
            echo "Drift detected in ${{ matrix.environment }} environment"
          else
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "No drift detected in ${{ matrix.environment }} environment"
          fi

      - name: Create Drift Issue
        if: steps.check-drift.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check if drift issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift,${{ matrix.environment }}',
              state: 'open'
            });

            if (issues.length === 0) {
              // Create new drift issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Terraform Drift Detected - ${{ matrix.environment }}`,
                body: `## Terraform Configuration Drift Detected
                
                **Environment:** ${{ matrix.environment }}
                **Detection Date:** ${new Date().toISOString()}
                **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                
                ### What happened?
                The Terraform state for the ${{ matrix.environment }} environment has drifted from the actual infrastructure.
                This means there are differences between what Terraform expects and what actually exists in AWS.
                
                ### Next Steps
                1. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to see the detected changes
                2. Investigate the root cause of the drift
                3. Either:
                   - Update the Terraform configuration to match the current state, or
                   - Apply the Terraform configuration to restore the desired state
                4. Close this issue once the drift is resolved
                
                ### Auto-generated
                This issue was automatically created by the drift detection workflow.`,
                labels: ['terraform-drift', 'infrastructure', '${{ matrix.environment }}', 'needs-investigation']
              });
            } else {
              // Update existing issue with new detection
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `🔍 **Drift still detected** - ${new Date().toISOString()}
                
                The drift in the ${{ matrix.environment }} environment is still present.
                
                **Latest Detection:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }

      - name: Comment on Success
        if: steps.check-drift.outputs.drift == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check if there are open drift issues for this environment
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift,${{ matrix.environment }}',
              state: 'open'
            });

            if (issues.length > 0) {
              // Comment that drift is resolved
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `✅ **Drift resolved** - ${new Date().toISOString()}
                
                No drift detected in the ${{ matrix.environment }} environment.
                
                **Verification Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                
                Consider closing this issue if the drift has been permanently resolved.`
              });
            }
