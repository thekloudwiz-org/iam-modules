name: Repository Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - create-repositories
          - update-trust-policies
          - add-external-repo
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - qa
          - prd
      external_repo:
        description: 'External repository name (for add-external-repo action)'
        required: false
        type: string

env:
  TF_VERSION: "1.5.0"
  AWS_REGION: "us-east-1"

jobs:
  repository-management:
    name: ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ github.event.inputs.environment }}
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: repo-mgmt-${{ github.event.inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/${{ github.event.inputs.environment }}.hcl \
            -input=false

      - name: Create Repositories
        if: github.event.inputs.action == 'create-repositories'
        run: |
          terraform apply \
            -target=module.repositories \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -auto-approve

      - name: Update Trust Policies
        if: github.event.inputs.action == 'update-trust-policies'
        run: |
          terraform apply \
            -target=module.trust_policies \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -auto-approve

      - name: Add External Repository
        if: github.event.inputs.action == 'add-external-repo'
        run: |
          if [ -z "${{ github.event.inputs.external_repo }}" ]; then
            echo "Error: External repository name is required for this action"
            exit 1
          fi
          
          # Create a temporary tfvars file with the external repo
          cat > temp_external.tfvars << EOF
          external_repositories = ["${{ github.event.inputs.external_repo }}"]
          EOF
          
          terraform apply \
            -target=module.trust_policies \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var-file="global.tfvars" \
            -var-file="temp_external.tfvars" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -auto-approve
          
          # Clean up temp file
          rm temp_external.tfvars
